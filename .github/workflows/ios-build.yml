name: iOS Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend PWA
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          ./build-hybrid.sh

      - name: Build iOS App (Unsigned IPA)
        run: |
          set -o pipefail
          cd ios
          xcodebuild clean build \
            -project ReadApp.xcodeproj \
            -scheme ReadApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ReadApp.app Payload/
          codesign --force --deep --sign - Payload/ReadApp.app
          zip -r ReadApp.ipa Payload
          
      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== XCODEBUILD FULL LOG ==="
          cat ios/xcodebuild.log || echo "No xcodebuild.log found"
          
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ios/xcodebuild.log
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadApp-IPA
          path: ios/ReadApp.ipa

      - name: Publish Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build"
          body: "Auto-generated nightly build from main branch."
          prerelease: true
          files: ios/ReadApp.ipa

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/ReadApp.ipa
